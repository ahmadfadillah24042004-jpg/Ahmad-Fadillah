name: Build gallery
on:
  push:
    paths: ['images/**', 'scripts/build_gallery.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python scripts/build_gallery.py
      - run: |
          git config user.name "gallery-bot"
          git config user.email "gallery-bot@users.noreply.github.com"
          git add images-web data/manifest.js
          git diff --cached --quiet || (git commit -m "Update gallery" && git push)
